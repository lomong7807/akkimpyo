<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>가계부 목업</title>
<style>
/* Layout: 넓은 창은 가운데 휴대폰 틀(내용 폭 390px)과 오른쪽 목업 조작판, 좁은 창은 틀 없이 화면 전체와 위쪽 접는 조작 띠 */
:root{
  --bg:#F6F7F8; --surface:#FFFFFF; --line:#E4E7EA; --fg:#15181B; --sub:#5B6670;
  --accent:#0F7B5F; --on-accent:#FFFFFF; --accent-weak:#E7F3EE; --danger:#C4372C;
  --track:#E9ECEF; --press:#EFF1F3; --knob:#FFFFFF; --band-bg:#15181B; --band-fg:#FFFFFF;
  --scrim:rgba(21,24,27,.45); --shadow:0 8px 24px rgba(21,24,27,.16),0 2px 6px rgba(21,24,27,.10);
  --stage:#E3E7EA; --device:#15181B;
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;
  --r-card:12px; --r-ctl:10px; --r-pill:999px;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  --frame-top:14px; --frame-bottom:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1214; --surface:#181C1F; --line:#2A3035; --fg:#ECEFF1; --sub:#98A3AC;
    --accent:#3CCB9E; --on-accent:#0F1214; --accent-weak:#16322A; --danger:#F0796E;
    --track:#262C31; --press:#21262A; --knob:#ECEFF1; --band-bg:#2A3035; --band-fg:#ECEFF1;
    --scrim:rgba(0,0,0,.6); --shadow:0 8px 24px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.4);
    --stage:#07090A; --device:#2A3035;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1214; --surface:#181C1F; --line:#2A3035; --fg:#ECEFF1; --sub:#98A3AC;
  --accent:#3CCB9E; --on-accent:#0F1214; --accent-weak:#16322A; --danger:#F0796E;
  --track:#262C31; --press:#21262A; --knob:#ECEFF1; --band-bg:#2A3035; --band-fg:#ECEFF1;
  --scrim:rgba(0,0,0,.6); --shadow:0 8px 24px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.4);
  --stage:#07090A; --device:#2A3035;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--stage);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;margin:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
.ic{display:block;flex:none}
.num,.amt{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pad{padding-left:var(--gl);padding-right:var(--gr)}

/* ---------- 무대(목업 바깥) ---------- */
.stage{min-height:100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:24px 40px;padding-block:24px;padding-left:var(--gl);padding-right:var(--gr)}
.device{position:relative;flex:none;order:1;width:410px;max-width:100%;height:clamp(640px, calc(100vh - 48px), 864px);border:10px solid var(--device);border-radius:48px;overflow:hidden;background:var(--bg)}
.mock-panel{order:2;flex:0 1 300px;min-width:0;max-width:340px;border:1px dashed var(--sub);border-radius:var(--r-card);background:var(--surface);color:var(--fg)}
.mp-summary{list-style:none;display:flex;flex-direction:column;gap:4px;padding:16px 16px 8px;cursor:default}
.mp-summary::-webkit-details-marker{display:none}
.mp-title{font-size:16px;font-weight:700}
.mp-note{font-size:13px;color:var(--sub)}
.mp-caret{display:none}
.mp-body{display:flex;flex-direction:column;gap:14px;padding:8px 16px 16px}
.mp-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mp-label{font-size:14px;font-weight:600}
.mp-seg{display:inline-flex;padding:3px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--bg)}
.mp-seg button{min-height:36px;padding:0 14px;border-radius:var(--r-pill);font-size:14px;color:var(--sub)}
.mp-seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:700}
.mp-check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.mp-check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.mp-check b{display:block;font-size:14px;font-weight:600}
.mp-check small{display:block;font-size:13px;color:var(--sub)}

@media (max-width:639px){
  :root{--frame-top:0px;--frame-bottom:0px}
  body{height:100%;background:var(--surface)}
  .stage{height:100%;min-height:0;flex-direction:column;flex-wrap:nowrap;align-items:stretch;justify-content:flex-start;gap:0;padding-block:0;padding-left:0;padding-right:0}
  .device{width:100%;height:auto;flex:1 1 auto;min-height:0;border:0;border-radius:0}
  .mock-panel{order:0;flex:none;max-width:none;border:0;border-bottom:1px dashed var(--sub);border-radius:0}
  .mp-summary{flex-direction:row;align-items:center;gap:8px;min-height:44px;padding:4px var(--gr) 4px var(--gl);cursor:pointer}
  .mp-title{font-size:14px;flex:none}
  .mp-note{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mp-caret{display:block;color:var(--sub)}
  .mock-panel[open] .mp-caret{transform:rotate(180deg)}
  .mp-body{padding:2px var(--gr) 12px var(--gl);gap:10px}
}

/* ---------- 앱 틀 ---------- */
.app{position:relative;display:flex;flex-direction:column;height:100%;background:var(--bg);overflow:hidden;isolation:isolate}
.topbar{flex:none;position:relative;z-index:6;display:flex;align-items:center;gap:8px;min-height:calc(56px + var(--frame-top));padding:var(--frame-top) var(--gr) 0 var(--gl);background:var(--surface);border-bottom:1px solid var(--line)}
.ledger-btn{display:flex;align-items:center;gap:4px;min-width:0;min-height:44px;padding-right:4px;font-size:20px;font-weight:700;letter-spacing:-0.01em}
.ledger-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ledger-btn .ic{color:var(--sub)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:4px}
.tb-chip{display:flex;align-items:center;min-height:44px;padding:0 2px}
.tb-chip .pill{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 10px;border-radius:var(--r-pill);font-size:14px;font-weight:600;background:var(--bg);color:var(--fg)}
.tb-chip.accent .pill{background:var(--accent-weak);color:var(--accent)}
.topbar.sub{display:grid;grid-template-columns:1fr auto 1fr}
.back{display:flex;align-items:center;gap:2px;min-height:44px;margin-left:-6px;font-size:16px;justify-self:start}
.tb-title{max-width:190px;font-size:20px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar.sub .tb-right{justify-self:end;margin-left:0}
.tb-action{min-height:44px;padding:0 4px;font-size:16px;font-weight:600;color:var(--accent)}
.offline-band{flex:none;display:flex;align-items:center;gap:8px;padding:10px var(--gr) 10px var(--gl);background:var(--band-bg);color:var(--band-fg);font-size:14px;line-height:1.35}
.body-wrap{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.screen{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-bottom:24px;outline:none}
.screen.has-fab{padding-bottom:96px}
.fab{position:absolute;right:var(--gr);bottom:16px;z-index:8;display:grid;place-items:center;width:56px;height:56px;border-radius:var(--r-pill);background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow)}
.tabbar{flex:none;position:relative;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);padding:0 var(--gr) var(--frame-bottom) var(--gl);background:var(--surface);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;font-size:13px;color:var(--sub)}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}

.ledger-menu{position:absolute;inset:0;z-index:20}
.lm-scrim{position:absolute;inset:0;background:var(--scrim)}
.lm-panel{position:relative;padding-block:4px 8px;background:var(--surface);border-radius:0 0 var(--r-card) var(--r-card);box-shadow:var(--shadow)}
.lm-item{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px var(--gr) 8px var(--gl);text-align:left}
.lm-item .ic{color:var(--accent)}
.lm-text{display:flex;flex-direction:column;flex:1;min-width:0}
.lm-text .t{font-size:16px;font-weight:500}
.lm-text .s{font-size:13px;color:var(--sub)}
.lm-item[aria-checked="true"] .t{color:var(--accent);font-weight:700}
.lm-sep{height:1px;margin:4px var(--gr) 4px var(--gl);background:var(--line)}

/* ---------- 공통 구역 ---------- */
.stack{display:flex;flex-direction:column;gap:8px;padding-top:8px}
.sec{display:block;width:100%;padding:16px var(--gr) 16px var(--gl);background:var(--surface);color:var(--fg);text-align:left}
.sec-flush{display:block;padding-block:4px 8px;background:var(--surface)}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:28px;font-size:16px;font-weight:700}
.sec-flush > .sec-head{min-height:52px;padding-top:8px}
.sec-head .ic{color:var(--sub)}
.sec-head .lead{display:flex;align-items:baseline;gap:6px;min-width:0}
.sync-note{font-size:13px;font-weight:400;color:var(--sub)}
.sec-desc{margin:4px 0 12px;font-size:14px;color:var(--sub)}
.kv{display:flex;align-items:baseline;justify-content:space-between;gap:12px;min-height:30px}
.kv .k{font-size:14px;color:var(--sub)}
.kv .amt{font-size:16px;font-weight:600;white-space:nowrap}
.kv.total{margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}
.kv.total .k{color:var(--fg);font-weight:600}
.kv.lg .amt{font-size:20px;font-weight:700}
.big-block{display:flex;flex-direction:column;margin:8px 0 6px}
.big-block .k{font-size:14px;color:var(--sub)}
.big-block .amt{text-align:left}
.big{font-size:32px;font-weight:700;line-height:1.2;letter-spacing:-0.02em}
.amt{text-align:right}
.amt.in{color:var(--accent)}
.amt.xfer{color:var(--sub)}
.amt.cancel{color:var(--sub);text-decoration:line-through}
.danger{color:var(--danger)}
.bar-row{display:flex;align-items:center;gap:12px;min-height:28px}
.bar{position:relative;display:block;flex:1;height:8px;overflow:hidden;border-radius:var(--r-pill);background:var(--track)}
.bar-fill{display:block;width:var(--w,0%);height:100%;border-radius:var(--r-pill);background:var(--accent)}
.bar-fill.over{background:var(--danger)}
.pct{min-width:40px;font-size:14px;font-weight:600;text-align:right}
.sub-line{display:block;font-size:14px;color:var(--sub)}
.ev-title{display:block;margin-top:6px;font-size:16px;font-weight:600}
.help{font-size:13px;line-height:1.4;color:var(--sub)}
.err{display:flex;align-items:flex-start;gap:4px;font-size:13px;line-height:1.4;color:var(--danger)}
.err .ic{margin-top:1px}
.hint{padding:28px var(--gr) 28px var(--gl);font-size:14px;color:var(--sub);text-align:center}
.empty{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:8px;padding:48px var(--gr) 48px var(--gl);background:var(--surface);text-align:center}
.empty p{font-size:16px;color:var(--sub)}

/* ---------- 버튼과 입력 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:var(--r-ctl);font-size:16px;font-weight:600;white-space:nowrap}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-secondary{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn-tonal{background:var(--accent-weak);color:var(--accent)}
.btn-danger{background:var(--surface);color:var(--danger);border:1px solid var(--line)}
.btn-block{width:100%;min-height:52px}
.btn-sm{padding:0 12px;font-size:14px}
.btn-link{align-self:flex-start;min-height:44px;font-size:14px;font-weight:600;color:var(--accent)}
.link-more{display:flex;align-items:center;gap:2px;align-self:center}
.search-form{display:flex;flex-direction:column;gap:16px}
.search-chips .chips{margin-top:-4px}
.gap-top{margin-top:8px}
.rule-top{border-top:1px solid var(--line)}
.btn-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-pair.one{grid-template-columns:1fr}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--r-ctl);color:var(--fg)}
.field{display:flex;flex-direction:column;gap:6px}
.lbl{font-size:14px;font-weight:600;color:var(--sub)}
.input{display:flex;align-items:center;width:100%;min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface);color:var(--fg);font-size:16px;text-align:left}
.input:focus,.input:focus-visible{outline:none;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.input[aria-invalid="true"]{border-color:var(--danger)}
.input[type="search"]{-webkit-appearance:none;appearance:none}
.input[type="search"]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.picker{justify-content:space-between;gap:8px;cursor:pointer}
.picker > span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picker .ph{color:var(--sub)}
.picker .ic{color:var(--sub)}
.quick{display:flex;flex-direction:column;gap:6px}
.quick-row{display:flex;gap:8px}
.quick-row .input{flex:1;min-width:0}
.quick-err{display:flex;flex-direction:column}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.chip{position:relative;display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 12px 0 14px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--surface);color:var(--fg);font-size:14px;font-weight:500;white-space:nowrap}
.chip::after{content:"";position:absolute;inset:-2px 0}
.chip.on{border-color:transparent;background:var(--accent-weak);color:var(--accent);font-weight:600}
.chip-clear{min-height:40px;padding:0 6px;font-size:14px;font-weight:600;color:var(--accent)}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;font-size:16px;cursor:pointer}
.switch{appearance:none;-webkit-appearance:none;position:relative;flex:none;width:52px;height:32px;margin:0;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--track);cursor:pointer;transition:background-color .2s}
.switch::before{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:var(--r-pill);background:var(--knob);box-shadow:inset 0 0 0 1px var(--line);transition:transform .2s}
.switch:checked{border-color:var(--accent);background:var(--accent)}
.switch:checked::before{transform:translateX(20px);box-shadow:none}

/* ---------- 거래 줄 ---------- */
.day-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:16px var(--gr) 8px var(--gl);font-size:14px;color:var(--sub)}
.day-head .d{font-weight:600;color:var(--fg)}
.tx-list{background:var(--surface)}
.tx{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) auto;column-gap:8px;align-items:start;width:100%;min-height:64px;padding:12px var(--gr) 12px var(--gl);background:var(--surface);color:var(--fg);text-align:left}
.tx-list > li + li > .tx::before{content:"";position:absolute;top:0;left:calc(var(--gl) + 56px);right:0;border-top:1px solid var(--line)}
.tx-time{padding-top:2px;font-size:13px;line-height:1.35;color:var(--sub);font-variant-numeric:tabular-nums}
.tx-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.tx-title{font-size:16px;font-weight:500;overflow-wrap:anywhere}
.tx-title.strike{color:var(--sub);text-decoration:line-through}
.tx-meta{font-size:14px;color:var(--sub);overflow-wrap:anywhere}
.tx-tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px}
.tx-amt{font-size:16px;font-weight:600;white-space:nowrap}
.tx-actions{grid-column:2 / -1;display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.who{font-size:13px;color:var(--sub)}
.tag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border:1px solid var(--line);border-radius:var(--r-pill);font-size:13px;color:var(--sub);white-space:nowrap}
.tag.accent{border-color:transparent;background:var(--accent-weak);color:var(--accent);font-weight:600}

/* ---------- 화면별 ---------- */
.month-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-6px 0 6px}
.month-nav{display:flex;align-items:center;gap:2px;margin-left:-12px}
.month-label{min-width:104px;font-size:16px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.row-actions{display:flex;margin-right:-10px}
.period-row{display:flex;align-items:center;gap:8px}
.period-row .picker{flex:1;min-width:0}
.sw-row{display:flex;align-items:center;gap:12px;min-height:44px}
.sw-label{flex:none;width:20px;font-size:13px;color:var(--sub)}
.sw-items{display:flex;flex-wrap:wrap;gap:4px}
.sw{position:relative;min-height:36px;padding:0 12px;border-radius:var(--r-pill);font-size:14px;font-weight:500;color:var(--sub)}
.sw::after{content:"";position:absolute;inset:-4px 0}
.sw.on{background:var(--accent-weak);color:var(--accent);font-weight:700;cursor:default}
.cat-row{display:flex;flex-direction:column;gap:8px;width:calc(100% + var(--gl) + var(--gr));margin:0 calc(-1 * var(--gr)) 0 calc(-1 * var(--gl));padding:10px var(--gr) 10px var(--gl);text-align:left}
.cat-top{display:flex;align-items:center;gap:8px}
.cat-top .n{flex:1;min-width:0;font-size:16px}
.cat-top .amt{font-weight:600}
.cat-top .ic{color:var(--sub)}
.cat-list{margin-top:4px}
.group-head{padding:16px var(--gr) 8px var(--gl);font-size:14px;font-weight:600;color:var(--sub)}
.ev-list{background:var(--surface)}
.ev-row{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:8px;row-gap:2px;width:100%;min-height:72px;padding:14px var(--gr) 14px var(--gl);background:var(--surface);color:var(--fg);text-align:left}
.ev-list > li + li > .ev-row::before{content:"";position:absolute;top:0;left:var(--gl);right:0;border-top:1px solid var(--line)}
.ev-name{display:flex;align-items:center;gap:8px;min-width:0;font-size:16px;font-weight:600}
.ev-period{grid-column:1;font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}
.ev-total{grid-column:1;font-weight:600}
.ev-chev{grid-column:2;grid-row:1 / span 3;align-self:center;color:var(--sub)}
.notice{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.notice-head{display:flex;align-items:center;gap:8px;font-weight:700}
.notice-head .ic{color:var(--sub)}
.notice-body{font-size:14px;color:var(--sub)}
.period{margin-bottom:8px;font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}
.menu{background:var(--surface)}
.menu-row{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:0 var(--gr) 0 var(--gl);background:var(--surface);color:var(--fg);font-size:16px;text-align:left}
.menu > li + li > .menu-row::before{content:"";position:absolute;top:0;left:calc(var(--gl) + 36px);right:0;border-top:1px solid var(--line)}
.menu-row > .ic:first-child{color:var(--sub)}
.menu-row .grow{flex:1;min-width:0}
.menu-row .chev{color:var(--sub)}
.menu-row.danger,.menu-row.danger > .ic:first-child{color:var(--danger)}
.sync-foot{padding:8px var(--gr) 8px var(--gl);font-size:13px;color:var(--sub)}

/* ---------- 거래 입력(전체 화면) ---------- */
.fullsheet{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--bg);transform:translateY(100%);transition:transform .2s ease-out}
.fullsheet.open{transform:none}
.fs-top{flex:none;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;min-height:calc(56px + var(--frame-top));padding:var(--frame-top) calc(var(--gr) - 6px) 0 calc(var(--gl) - 10px);background:var(--surface);border-bottom:1px solid var(--line)}
.fs-title{font-size:20px;font-weight:700;text-align:center}
.fs-form{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.fs-body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:20px;overflow-y:auto;padding:16px var(--gr) 24px var(--gl)}
.fs-foot{flex:none;padding:12px var(--gr) calc(12px + var(--frame-bottom)) var(--gl);background:var(--surface);border-top:1px solid var(--line)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--track)}
.seg button{min-height:44px;border-radius:var(--r-pill);font-size:16px;font-weight:600;color:var(--sub);text-align:center}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--accent);font-weight:700}
.seg button:disabled{opacity:.45}
.amount-box{display:flex;align-items:center;gap:6px;min-height:64px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface)}
.amount-box:focus-within{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.amount-box.invalid{border-color:var(--danger)}
.amount-box input{flex:1;min-width:0;padding:0;border:0;outline:none;background:none;font-size:32px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.amount-box .unit{font-size:20px;font-weight:600;color:var(--sub)}
.more-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:52px;padding-top:4px;border-top:1px solid var(--line);font-size:16px;font-weight:600}
.more-body{display:flex;flex-direction:column;gap:20px}
.time-row{display:flex;gap:8px}
.time-row .input{flex:1;min-width:0}

/* ---------- 아래에서 올라오는 판 ---------- */
.sheet-layer{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-layer .scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .2s}
.sheet{position:relative;display:flex;flex-direction:column;max-height:82%;padding-bottom:var(--frame-bottom);background:var(--surface);border-radius:var(--r-card) var(--r-card) 0 0;box-shadow:var(--shadow);transform:translateY(100%);transition:transform .2s ease-out}
.sheet-layer.open .scrim{opacity:1}
.sheet-layer.open .sheet{transform:none}
.sheet-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:56px;padding:4px calc(var(--gr) - 10px) 0 var(--gl)}
.sheet-title{font-size:16px;font-weight:700}
.sheet-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding-bottom:12px}
.sheet-pad{display:flex;flex-direction:column;gap:16px;padding:0 var(--gr) 8px var(--gl)}
.sheet-desc{font-size:16px}
.dup{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-card)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;padding:0 var(--gr) 0 var(--gl);font-size:16px;text-align:left}
.opt[aria-pressed="true"]{color:var(--accent);font-weight:700}
.opt-l{display:flex;flex-direction:column}
.opt-s{font-size:13px;font-weight:400;color:var(--sub)}
.opt-group{padding:12px var(--gr) 4px var(--gl);font-size:13px;font-weight:600;color:var(--sub)}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:0 calc(var(--gr) - 6px) 0 calc(var(--gl) - 6px)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:4px var(--gr) 8px var(--gl)}
.cal-wd{padding:6px 0;font-size:13px;color:var(--sub);text-align:center}
.cal-day{justify-self:center;width:44px;height:44px;border-radius:var(--r-pill);font-size:16px;text-align:center;font-variant-numeric:tabular-nums}
.cal-day.today{box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent);font-weight:600}
.cal-day.sel{background:var(--accent);color:var(--on-accent);font-weight:700}

.toast{position:absolute;left:50%;bottom:calc(var(--tab-h, 68px) + 16px);z-index:60;width:max-content;max-width:calc(100% - 32px);padding:12px 16px;border-radius:var(--r-card);background:var(--band-bg);color:var(--band-fg);font-size:14px;line-height:1.4;text-align:center;transform:translateX(-50%)}
.app.fab-on .toast{bottom:calc(var(--tab-h, 68px) + 84px)}
.app.sheet-open .toast{bottom:96px}

/* ---------- 누를 때 ---------- */
.btn,.fab,.chip,.icon-btn,.tab,.sw,.cal-day,.tb-chip,.seg button{transition:transform .1s ease-out}
.btn:active,.fab:active,.chip:active,.icon-btn:active,.tab:active,.sw:active,.cal-day:active,.tb-chip:active,.seg button:active{transform:scale(.97)}
.btn:disabled:active,.seg button:disabled:active{transform:none}
.tx.press-row:active,.sec-btn:active,.menu-row:active,.ev-row:active,.cat-row:active,.opt:active,.lm-item:active{background-color:var(--press)}
@media (hover:hover){
  .tx.press-row:hover,.sec-btn:hover,.menu-row:hover,.ev-row:hover,.cat-row:hover,.opt:hover,.lm-item:hover,.icon-btn:hover{background-color:var(--press)}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
  .btn:active,.fab:active,.chip:active,.icon-btn:active,.tab:active,.sw:active,.cal-day:active,.tb-chip:active,.seg button:active{transform:none}
}

  let title, meta, cls = '', amt;
  if (t.type === 'xfer') {
    const to = accName(L, t.to);
    title = '이체'; meta = `${accName(L, t.acc)}에서 ${to}${euroRo(to)}`; cls = 'xfer'; amt = won(t.amount);
  } else {
    title = t.title || t.cat || '미분류'; meta = `${t.cat || '미분류'} · ${accName(L, t.acc)}`;
    if (t.type === 'in' || t.kind !== 'normal') { cls = 'in'; amt = '+' + won(t.amount); } else amt = won(t.amount);
  }
  if (cancel) cls = 'cancel';
  let tags = '';
  if (multi && t.type !== 'xfer' && t.payer) tags += `<span class="who">${esc(t.payer)}</span>`;
  const ev = eventOf(t);
  if (ev && !o.hideEvent) { const e = L.events.find(x => x.id === ev); if (e) tags += `<span class="tag">${ic('calendar-star', 14)}${esc(e.name)}</span>`; }
  if (o.manual && t.evMode === 'in') tags += '<span class="tag">직접 넣음</span>';
  if (t.kind === 'refund') tags += '<span class="tag">환불</span>';
  if (t.kind === 'back') tags += '<span class="tag">돌려받음</span>';
  if (cancel) tags += '<span class="tag">취소</span>';
  if (t.status === 'unconfirmed') tags += '<span class="tag accent">미확인</span>';
  if (t.unsent) tags += `<span class="tag">${ic('cloud-arrow-up', 14)}보내지 않음</span>`;
  let actions = '';
  if (o.evActions && !S.viewer) {
    actions = `<button type="button" class="btn btn-secondary btn-sm" data-act="ev-out" data-id="${t.id}">이벤트에서 빼기</button>`;
    if (t.evMode === 'in') actions += `<button type="button" class="btn btn-secondary btn-sm" data-act="ev-auto" data-id="${t.id}">자동으로 되돌리기</button>`;
  }
  if (o.exActions && !S.viewer) actions = `<button type="button" class="btn btn-secondary btn-sm" data-act="ev-auto" data-id="${t.id}">자동으로 되돌리기</button>`;
  const inner = `<span class="tx-time">${t.time || '시각 없음'}</span>
    <span class="tx-main"><span class="tx-title${cancel ? ' strike' : ''}">${esc(title)}</span><span class="tx-meta">${esc(meta)}</span>${tags ? `<span class="tx-tags">${tags}</span>` : ''}</span>
    <span class="tx-amt amt ${cls}">${amt}</span>${actions ? `<span class="tx-actions">${actions}</span>` : ''}`;
  return o.interactive
    ? `<li><button type="button" class="tx press-row" data-act="tx-edit" data-id="${t.id}">${inner}</button></li>`
    : `<li><div class="tx">${inner}</div></li>`;
}
function dayHeadHTML(date, items) {
  const e = sumExp(items), i = sumInc(items);
  const r = e > 0 ? `지출 ${won(e)}` : (i > 0 ? `수입 +${won(i)}` : '');
  return `<div class="day-head"><span class="d num">${fmtDate(date)}</span><span class="num">${r}</span></div>`;
}
function groupsHTML(list, o) {
  o = o || {};
  return groupByDate(list).map(g => {
    const forTotal = o.fullDay ? ledgerTx(S.ledger).filter(t => t.date === g.date) : g.items;
    return `<div class="day">${dayHeadHTML(g.date, forTotal)}<ul class="tx-list">${g.items.map(t => txRowHTML(t, o)).join('')}</ul></div>`;
  }).join('');
}
function monthNavHTML(scope, ym, right) {
  return `<div class="month-row"><div class="month-nav"><button type="button" class="icon-btn" data-act="month" data-scope="${scope}" data-d="-1" aria-label="이전 달">${ic('caret-left')}</button><span class="month-label">${monthLabel(ym)}</span><button type="button" class="icon-btn" data-act="month" data-scope="${scope}" data-d="1" aria-label="다음 달">${ic('caret-right')}</button></div>${right || ''}</div>`;
}
const emptyMonthHTML = ym => `<div class="empty"><p>${monthShort(ym)}에는 거래가 없어요.</p>${S.viewer ? '' : '<button type="button" class="btn btn-primary" data-act="fab">거래 입력</button>'}</div>`;

/* ---------- 화면: 홈 C-01 ---------- */

      <span class="kv"><span class="k">${over ? '초과 금액' : '남은 금액'}</span><span class="amt${over ? ' danger' : ''}">${won(Math.abs(L.budget - exp))}</span></span>
    </button>`;
  } else if (!S.viewer) {
    h += `<section class="sec"><h2 class="sec-head">${monthShort(ym)} 예산</h2><p class="sec-desc">예산을 정하면 이번 달에 얼마나 썼는지 한눈에 보여요.</p><button type="button" class="btn btn-secondary" data-act="todo" data-name="예산 화면">예산 정하기</button></section>`;
  }
  const ongoing = L.events.filter(e => evState(e) === 'now').sort((a, b) => a.start < b.start ? -1 : 1)[0];
  if (ongoing) {
    h += `<button type="button" class="sec sec-btn" data-act="event" data-id="${ongoing.id}">
      <span class="sec-head"><span>진행 중 이벤트</span>${chev()}</span>
      <span class="ev-title">${esc(ongoing.name)}</span><span class="sub-line num">${fmtPeriod(ongoing)}</span>
      <span class="kv"><span class="k">지금까지</span><span class="amt">${won(evTotal(ongoing, L))}</span></span>
    </button>`;
  }
  const bal = balances(L), byType = {};
  L.accounts.forEach(a => { byType[a.type] = (byType[a.type] || 0) + bal[a.id]; });
  h += `<button type="button" class="sec sec-btn" data-act="todo" data-name="계좌 목록 화면">
    <span class="sec-head"><span class="lead">계좌 잔액${syncNote()}</span>${chev()}</span>
    ${['bank', 'card', 'cash'].filter(k => k in byType).map(k => `<span class="kv"><span class="k">${TYPE_NAME[k]}</span><span class="amt">${won(byType[k])}</span></span>`).join('')}
    <span class="kv total"><span class="k">자산 합계</span><span class="amt">${won(Object.values(bal).reduce((s, v) => s + v, 0))}</span></span>

  const unc = ledgerTx(L.id).filter(t => t.status === 'unconfirmed').length;

  return h;

function searchResultsHTML() {
  const s = S.search, q = s.q.trim().toLowerCase();
  if (s.from && s.to && s.from > s.to) return '';
  if (!q) return '<p class="hint">검색어를 1자 이상 입력하면 결과가 보여요.</p>';
  let list = ledgerTx(S.ledger).filter(t => (t.title + ' ' + t.memo).toLowerCase().includes(q) && (!s.from || t.date >= s.from) && (!s.to || t.date <= s.to));
  list = applyF(list, s.f).sort(cmpDesc);
  if (!list.length) return emptyFilterHTML('search', true);
  return `<section class="sec gap-top"><h2 class="sec-head">결과 ${list.length}건</h2><div class="kv"><span class="k">지출</span><span class="amt">${won(sumExp(list))}</span></div><div class="kv"><span class="k">수입</span>${incAmt(sumInc(list))}</div></section>${groupsHTML(list, { interactive: !S.viewer })}`;
}

/* ---------- 화면: 통계 E-01 ---------- */
function statsHTML() {
  const L = cur(), ym = S.statsMonth, all = monthTx(L.id, ym);
  const base = S.excludeEvents ? all.filter(t => !eventOf(t)) : all;
  const exp = sumExp(base), inc = sumInc(base);
  const sw = (l, on, name) => `<button type="button" class="sw${on ? ' on' : ''}"${on ? ' aria-current="page"' : ` data-act="todo" data-name="${name}"`}>${l}</button>`;
  let h = `<section class="sec" aria-label="통계 전환">
    <div class="sw-row"><span class="sw-label">월</span><div class="sw-items">${sw('월별', true)}${sw('카테고리', false, '카테고리별 통계 화면')}${L.members.length > 1 ? sw('사람별', false, '결제한 사람별 합계 화면') : ''}${sw('예산', false, '예산 대비 화면')}</div></div>
    <div class="sw-row"><span class="sw-label">연</span><div class="sw-items">${sw('연 단위', false, '연 단위 통계 화면')}${sw('회비', false, '회비 현황 화면')}</div></div>
  </section>
  <section class="sec rule-top">${monthNavHTML('stats', ym)}
    <label class="switch-row" for="exEv"><span>이벤트 지출 제외</span><input type="checkbox" class="switch" id="exEv"${S.excludeEvents ? ' checked' : ''}></label>
  </section>`;
  if (!all.length) return h + emptyMonthHTML(ym);
  h += `<section class="sec gap-top">
    <div class="kv"><span class="k">수입</span>${incAmt(inc)}</div>
    <div class="kv"><span class="k">지출</span><span class="amt">${won(exp)}</span></div>
    <div class="kv"><span class="k">차액</span><span class="amt">${signed(inc - exp)}</span></div>
    ${S.excludeEvents ? '<p class="help">이벤트에 묶인 지출을 뺀 합계예요.</p>' : ''}
  </section>`;
  const by = {};
  base.forEach(t => { if (t.type === 'out' && live(t)) { const c = t.cat || '미분류'; by[c] = (by[c] || 0) + expVal(t); } });
  const top = Object.entries(by).filter(e => e[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const max = top.length ? top[0][1] : 1;
  h += `<section class="sec gap-top"><h2 class="sec-head">지출이 큰 카테고리</h2>${top.length ? `<ul class="cat-list">${top.map(([c, v]) => `<li><button type="button" class="cat-row" data-act="todo" data-name="카테고리별 통계 화면"><span class="cat-top"><span class="n">${esc(c)}</span><span class="amt">${won(v)}</span>${chev()}</span><span class="bar" aria-hidden="true"><span class="bar-fill" style="--w:${(v / max * 100).toFixed(1)}%"></span></span></button></li>`).join('')}</ul>` : '<p class="help gap-top">이 달에는 지출이 없어요.</p>'}</section>`;
  return h;
}

/* ---------- 화면: 이벤트 상세 F-03 ---------- */
function eventHTML() {
  const L = cur(), e = evById(S.sub.id);
  const inTx = evTxs(e, L).sort(cmpAsc), total = sumExp(inTx);
  const outside = inTx.filter(t => !inPeriod(t, e)), days = evDays(e);
  const avg = Math.round((total - sumExp(outside)) / days);
  const exTx = txs.filter(t => t.ledger === L.id && t.type === 'out' && t.evMode === 'out' && inPeriod(t, e)).sort(cmpAsc);
  const by = {};
  inTx.forEach(t => { if (live(t)) { const c = t.cat || '미분류'; by[c] = (by[c] || 0) + expVal(t); } });
  const cats = Object.entries(by).filter(x => x[1] !== 0).sort((a, b) => b[1] - a[1]);
  let h = `<div class="stack"><section class="sec"><p class="period">${fmtPeriod(e)} · ${days}일</p>
    <div class="kv lg"><span class="k">총액</span><span class="amt">${won(total)}</span></div>
    <div class="kv"><span class="k">하루 평균</span><span class="amt">${won(avg)}</span></div>
    ${outside.length ? `<p class="help">기간 밖 거래 ${outside.length}건은 하루 평균에서 뺐어요.</p>` : ''}</section>`;
  if (cats.length) h += `<section class="sec"><h2 class="sec-head">카테고리별</h2>${cats.map(([c, v]) => `<div class="kv"><span class="k">${esc(c)}</span><span class="amt">${won(v)}</span></div>`).join('')}</section>`;
  h += `<section class="sec-flush"><div class="sec-head pad"><span>묶인 거래 ${inTx.length}건</span>${S.viewer ? '' : `<button type="button" class="btn btn-secondary btn-sm" data-act="todo" data-name="거래 넣기 판">${ic('plus', 18)}<span>거래 넣기</span></button>`}</div>`;
  h += inTx.length ? groupsHTML(inTx, { evActions: true, manual: true, hideEvent: true }) : '<p class="hint">아직 묶인 거래가 없어요.</p>';
  h += '</section>';
  if (exTx.length) h += `<section class="sec-flush"><div class="sec-head pad"><span>제외한 거래 ${exTx.length}건</span></div>${groupsHTML(exTx, { exActions: true, hideEvent: true })}</section>`;
  if (!S.viewer) {
    h += `<section class="sec"><div class="btn-pair${e.repeat ? '' : ' one'}"><button type="button" class="btn btn-secondary" data-act="todo" data-name="이벤트 복제 화면">${ic('copy', 18)}<span>복제</span></button>${e.repeat ? '<button type="button" class="btn btn-secondary" data-act="todo" data-name="반복 중지 확인 창">반복 중지</button>' : ''}</div></section>
      <section class="sec"><button type="button" class="btn btn-danger btn-block" data-act="todo" data-name="이벤트 삭제 확인 창">${ic('trash', 18)}<span>이벤트 삭제</span></button></section>`;
  }
  return h + '</div>';
}

    if (dup) {
      openSheet({ title: '같은 거래가 이미 있어요', body: `<div class="sheet-pad"><p class="sheet-desc">날짜, 금액, 가맹점이 같은 거래가 있어요. 따로 쓴 거래라면 그래도 저장해 주세요.</p>
        <div class="dup"><div class="kv"><span>${fmtDate(dup.date)} · ${esc(dup.title || '이체')}</span><span class="amt">${won(dup.amount)}</span></div><p class="help">입력한 사람: ${esc(dup.by)}</p></div>
        <div class="btn-pair"><button type="button" class="btn btn-secondary" data-sheet-act="close">취소</button><button type="button" class="btn btn-primary" data-sheet-act="ok">그래도 저장</button></div></div>`,
        onAct: el => { if (el.dataset.sheetAct === 'ok') closeSheet(commitTx); } }, $('#txSave'));
      return;
    }
  }
  commitTx();
}
function commitTx() {
  const L = cur(), multi = L.members.length > 1;
  const base = {
    type: TX.type, amount: Number(TX.amount), title: TX.type === 'xfer' ? '' : TX.title.trim(), cat: TX.type === 'xfer' ? null : TX.cat,
    acc: TX.acc, to: TX.type === 'xfer' ? TX.to : null, date: TX.date, time: TX.time || null, memo: TX.memo.trim(),
    payer: TX.type === 'xfer' ? null : (multi ? TX.payer : ME), kind: TX.type === 'out' ? TX.kind : 'normal'
  };
  if (TX.mode === 'edit') {
    const t = txs.find(x => x.id === TX.id);
    Object.assign(t, base);
    if (S.offline) t.unsent = true;
  } else {
    seq++;
    txs.push(Object.assign({ id: 't' + seq, seq, ledger: L.id, by: ME, status: null, unsent: S.offline, evMode: 'auto', eventId: null }, base));
  }
  if (TX.type !== 'xfer') S.lastAcc[L.id][TX.type] = TX.acc;
  const msg = S.offline ? '기기에 저장했어요. 연결되면 보낼게요.' : (TX.mode === 'edit' ? '고친 내용을 저장했어요.' : '저장했어요.');
  closeTx();
  renderAll();
  toast(msg);
}

/* ---------- 한 줄 입력 F-114 ---------- */
function parseQuick(s) {
  const parts = s.trim().split(/\s+/);
  for (let i = parts.length - 1; i >= 0; i--) {
    const m = parts[i].match(/^(\d[\d,]*)원?$/);
    if (m) { const title = parts.filter((_, j) => j !== i).join(' '); return { amount: m[1].replace(/,/g, ''), title }; }
  }
  const glued = s.trim().match(/^(.*?)(\d[\d,]*)원?$/);
  return glued ? { amount: glued[2].replace(/,/g, ''), title: glued[1].trim() } : null;
}
function suggestCat(title) {
  const n = norm(title);
  if (!n) return null;
  const hit = ledgerTx(S.ledger).filter(t => t.type === 'out' && norm(t.title) === n).sort(cmpDesc)[0];
  return hit ? hit.cat : null;
}
function setQuickErr(msg) {
  S.quickErr = msg;
  const box = $('#quickErr'), inp = $('#quickInput');
  box.hidden = !msg;
  box.querySelector('span').textContent = msg;
  if (msg) inp.setAttribute('aria-invalid', 'true'); else inp.removeAttribute('aria-invalid');
}
function quickSubmit() {
  const v = S.quick.trim(), p = v ? parseQuick(v) : null, n = p ? Number(p.amount) : 0;
  if (!p || n < 1 || n > 9999999999) { setQuickErr('금액을 찾지 못했어요. 예: 점심 12000'); $('#quickInput').focus(); return; }
  setQuickErr('');
  S.quick = ''; $('#quickInput').value = '';
  openTx({ amount: p.amount, title: p.title, cat: suggestCat(p.title) }, $('#quickInput'));
}

/* ---------- 목업 조작 ---------- */
function setOffline(on) {
  S.offline = on;
  if (on) {
    if (!txs.some(t => t.unsent)) ledgerTx(S.ledger).filter(live).sort(cmpDesc).slice(0, 2).forEach(t => { t.unsent = true; });
  } else {
    const n = txs.filter(t => t.unsent).length;
    txs.forEach(t => { t.unsent = false; });
    if (n) toast(`다시 연결돼서 보내지 않은 입력 ${n}건을 보냈어요.`);
  }
  renderAll();
}
function setViewer(on) {
  S.viewer = on;
  if (on && !$('#txSheet').hidden) closeTx();
  if (on && SHEET) closeSheet();
  renderAll();
}
const darkMq = matchMedia('(prefers-color-scheme: dark)');
function currentTheme() { const t = document.documentElement.getAttribute('data-theme'); return t === 'dark' || t === 'light' ? t : (darkMq.matches ? 'dark' : 'light'); }
function paintThemeBtns() { const t = currentTheme(); $$('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeSet === t))); }
$$('[data-theme-set]').forEach(b => b.addEventListener('click', () => { document.documentElement.setAttribute('data-theme', b.dataset.themeSet); paintThemeBtns(); }));
darkMq.addEventListener('change', paintThemeBtns);
new MutationObserver(paintThemeBtns).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
$('#mpViewer').addEventListener('change', e => setViewer(e.target.checked));
$('#mpOffline').addEventListener('change', e => setOffline(e.target.checked));
const wideMq = matchMedia('(min-width: 640px)'), panel = $('#mockPanel');
const syncPanel = () => { panel.open = wideMq.matches; };
wideMq.addEventListener('change', syncPanel);
panel.querySelector('summary').addEventListener('click', e => { if (wideMq.matches) e.preventDefault(); });

/* ---------- 앱 안의 동작 ---------- */
function goTab(k) {
  closeLedgerMenu();
  if (S.tab === k && !S.sub) { $('#screen').scrollTop = 0; return; }
  S.tab = k; S.sub = null;
  renderAll(true);
}
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !app.contains(el)) return;
  const a = el.dataset.act;
  if (a !== 'ledger-toggle' && a !== 'ledger-pick' && el.closest('#ledgerMenu') == null) closeLedgerMenu();
  switch (a) {
    case 'tab': goTab(el.dataset.tab); break;
    case 'back': S.sub = null; renderAll(true); break;
    case 'event': S.tab = 'events'; S.sub = { type: 'event', id: el.dataset.id }; renderAll(true); break;
    case 'open-search': S.sub = { type: 'search' }; renderAll(true); setTimeout(() => { const q = $('#searchQ'); if (q) q.focus(); }, 0); break;
    case 'month': { const k = el.dataset.scope === 'list' ? 'listMonth' : 'statsMonth'; S[k] = addMonth(S[k], Number(el.dataset.d)); renderScreen(); break; }
    case 'filter': {
      const scope = el.dataset.scope, key = el.dataset.key, f = scope === 'list' ? S.listF : S.search.f, d = FILTERS.find(x => x.key === key);
      openOptions(d.name, d.opts(cur()), f[key], v => { f[key] = v; renderScreen(); const c = $(`[data-act="filter"][data-scope="${scope}"][data-key="${key}"]`); if (c) c.focus(); }, el);
      break;
    }
    case 'clear-f':
      if (el.dataset.scope === 'list') S.listF = emptyF();
      else if (el.dataset.all) S.search = { q: '', from: '', to: '', f: emptyF() };
      else S.search.f = emptyF();
      renderScreen();
      if (el.dataset.scope === 'search') { const q = $('#searchQ'); if (q) q.focus(); }
      break;
    case 'search-date': {
      const key = el.dataset.key;
      openCalendar({ title: key === 'from' ? '시작일' : '종료일', value: S.search[key], allowClear: true, onPick: v => { S.search[key] = v; renderScreen(); const p = $('#pick-' + key); if (p) p.focus(); } }, el);
      break;
    }
    case 'tx-edit': if (!S.viewer) openTx({ id: el.dataset.id }, el); break;
    case 'fab': if (!S.viewer) openTx({}, el); break;
    case 'quick-detail': { const v = S.quick.trim(); setQuickErr(''); S.quick = ''; $('#quickInput').value = ''; openTx({ title: v.slice(0, 100) }, $('#quickInput')); break; }
    case 'ev-out': { const t = txs.find(x => x.id === el.dataset.id); t.evMode = 'out'; t.eventId = null; renderScreen(); toast('이벤트에서 뺐어요.'); break; }
    case 'ev-auto': { const t = txs.find(x => x.id === el.dataset.id); t.evMode = 'auto'; t.eventId = null; renderScreen(); toast('자동으로 묶이도록 되돌렸어요.'); break; }
    case 'notice-close': S.noticeClosed[S.ledger] = true; renderScreen(); break;
    case 'ledger-toggle': if (S.menuOpen) closeLedgerMenu(true); else openLedgerMenu(); break;
    case 'ledger-pick': pickLedger(el.dataset.id); break;
    case 'ledger-close': closeLedgerMenu(true); break;
    case 'todo': { const n = el.dataset.name; closeLedgerMenu(); toast(`${n}${eunNeun(n)} 이 목업에 없어요.`); break; }
  }
});
app.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'quickForm') quickSubmit();
  else if (e.target.id === 'txForm') saveTx();
});
app.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'quickInput') { S.quick = t.value; if (S.quickErr) setQuickErr(''); }
  else if (t.id === 'searchQ') { S.search.q = t.value; $('#searchResults').innerHTML = searchResultsHTML(); }
  else if (TX && t.closest('#txSheet')) txInput(t);
});
app.addEventListener('change', e => {
  if (e.target.id === 'exEv') { S.excludeEvents = e.target.checked; renderScreen(); }
  else if (TX && e.target.id === 'txTime') { TX.time = e.target.value; }
});
// 칸을 벗어날 때 검사: 한 번이라도 입력한 칸만 검사하고, 오류 문구는 누른 동작이 끝난 뒤에 그린다
// (누르는 사이에 문구가 생겨 버튼이 밀리면 누른 것이 사라지기 때문이다).
let pointerDown = false, pendingPaint = null;
const flushPaint = () => { if (pendingPaint) { const f = pendingPaint; pendingPaint = null; setTimeout(f, 0); } };
document.addEventListener('pointerdown', () => { pointerDown = true; }, true);
document.addEventListener('pointerup', () => { pointerDown = false; flushPaint(); }, true);
document.addEventListener('pointercancel', () => { pointerDown = false; flushPaint(); }, true);
app.addEventListener('focusout', e => {
  if (e.target.id !== 'txAmount' || !TX || !TX.dirty || $('#txSheet').hidden) return;
  const paint = () => {
    if (!TX || $('#txSheet').hidden) return;
    const E = validateTx();
    TX.errors = Object.assign({}, TX.errors, { amount: E.amount });
    if (!E.amount) delete TX.errors.amount;
    paintErrors();
  };
  if (pointerDown) pendingPaint = paint; else setTimeout(paint, 0);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (SHEET) closeSheet();
  else if (!$('#txSheet').hidden) closeTx();
  else if (S.menuOpen) closeLedgerMenu(true);
});

/* ---------- 시작 ---------- */
$$('[data-icon]').forEach(el => { el.innerHTML = ic(el.dataset.icon, Number(el.dataset.size) || 20); });
$('#fab').innerHTML = ic('plus', 28);
syncPanel();
paintThemeBtns();
renderAll(true);
})();
</script>
