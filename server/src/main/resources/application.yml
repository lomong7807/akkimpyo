spring:
  application:
    name: account-book
  datasource:
    # 기본값을 두지 않는다. 셋 중 하나라도 없으면 기동하지 않는다(RequiredDbSettings).
    # 로컬 개발용 기본값은 application-local.yml(local 프로파일)에 있다.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      data-source-properties:
        # 제약 위반의 상세에는 그 행의 값(이메일, 비밀번호 해시, 이름, 메모 등)이 들어 있다. 예외와 로그에 싣지 않는다(#20).
        logServerErrorDetail: false
      # 장부 크기가 장부마다 크게 달라, 되풀이한 문장이 값과 무관한 일반 계획으로 바뀌면 큰 장부에서 느리다(#112).
      connection-init-sql: SET plan_cache_mode = force_custom_plan
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    formcontent:
      filter:
        # 폼 본문을 받지 않는다. 켜 두면 컨트롤러에 닿기 전에 본문을 읽다가 실패한다(500).
        enabled: false
  servlet:
    multipart:
      # 파일을 받는 API가 아직 없다. 켜 두면 모든 경로에서 본문을 읽고 깨진 본문이 415가 아니라 500이 된다.
      enabled: false
logging:
  pattern:
    # 요청 id(ADR 005). 요청 밖의 로그에서는 빈칸이다.
    correlation: "[%X{requestId:-}] "
  level:
    # Tomcat은 읽지 못한 요청의 주소와 헤더(토큰이 들 수 있다)를 INFO로 그대로 남긴다.
    org.apache.coyote.http11.Http11Processor: warn
    # 깨진 쿠키 헤더도 값째로 INFO로 남긴다.
    org.apache.tomcat.util.http.parser.Cookie: warn
server:
  tomcat:
    # 보내다 멈춘 연결이 스레드를 오래 잡지 않게 한다(#21). 전체가 아니라 다음 바이트를 기다리는 시간이고 쉬는 유지 연결에도 걸린다.
    connection-timeout: 10s
