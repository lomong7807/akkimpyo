spring:
  application:
    name: account-book
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/accountbook}
    username: ${DB_USERNAME:accountbook}
    password: ${DB_PASSWORD:accountbook}
    hikari:
      data-source-properties:
        # 제약 위반의 상세에는 그 행의 값(이메일, 비밀번호 해시, 이름, 메모 등)이 들어 있다. 예외와 로그에 싣지 않는다(#20).
        logServerErrorDetail: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    formcontent:
      filter:
        # 폼 본문을 받지 않는다. 켜 두면 컨트롤러에 닿기 전에 본문을 읽다가 실패한다(500).
        enabled: false
  servlet:
    multipart:
      # 파일을 받는 API가 아직 없다. 켜 두면 모든 경로에서 본문을 읽고 깨진 본문이 415가 아니라 500이 된다.
      enabled: false
management:
  endpoint:
    health:
      probes:
        # 공개하는 것은 /actuator/health 하나다. 쓰지 않는 하위 경로(liveness, readiness)를 만들지 않는다.
        enabled: false
logging:
  pattern:
    # 요청 id(ADR 005). 요청 밖의 로그에서는 빈칸이다.
    correlation: "[%X{requestId:-}] "
  level:
    # Tomcat은 읽지 못한 요청의 주소와 헤더(토큰이 들 수 있다)를 INFO로 그대로 남긴다.
    org.apache.coyote.http11.Http11Processor: warn
    # 깨진 쿠키 헤더도 값째로 INFO로 남긴다.
    org.apache.tomcat.util.http.parser.Cookie: warn
