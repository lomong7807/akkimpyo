# 진단 측정 E3용 덮어쓰기. shared_buffers를 DB 크기(약 1.5GB)보다 크게 한다.
#   docker compose -p akkimpyo-perf -f compose.yaml -f compose.perf.yaml -f perf/compose.big-cache.yaml up -d
services:
  db:
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - shared_buffers=2GB
    mem_limit: 4g
    memswap_limit: 4g
