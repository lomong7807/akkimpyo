# 배포 스크립트 시험(deploy/tests/deploy-suite)이 쓰는 최소 compose. 운영 compose(deploy/compose.yaml)를 쓰지 않는다.
# 서비스, 볼륨 이름과 변수를 받는 방법은 운영과 같다: 이미지와 SW_DISABLE은 배포 스크립트가 셸 환경으로,
# 나머지는 --env-file(/etc/akkimpyo/app.env)로 받는다. assets-prev는 운영처럼 /srv-prev/assets에 붙인다.
services:
  db:
    # 오래 도는 아무 프로세스. 백업은 가짜라 DB가 필요 없다.
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    networks: [akkimpyo]

  server:
    image: ${SERVER_IMAGE:?SERVER_IMAGE가 없다}
    networks: [akkimpyo]
    environment:
      DB_URL: ${DB_URL:?DB_URL이 없다}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD가 없다}
    depends_on: [db]

  proxy:
    image: ${WEB_IMAGE:?WEB_IMAGE가 없다}
    networks: [akkimpyo]
    environment:
      SITE_ADDRESS: ${WEB_ORIGIN:?WEB_ORIGIN이 없다}
      SW_DISABLE: ${SW_DISABLE:?SW_DISABLE가 없다}
    volumes:
      - assets-prev:/srv-prev/assets:ro

networks:
  akkimpyo: {}

volumes:
  assets-prev:
