# 아낌표 운영 compose(#52, ADR 005). 프록시(웹 이미지, Caddy), 서버, PostgreSQL 17.
#
# 서버에는 owner가 /opt/akkimpyo/deploy/compose.yaml로 설치한다(root 소유). 레포의 이 파일을 바꿔도 서버의 구성은 바뀌지 않는다.
# 같은 폴더에 Caddyfile과 db-init.sh가 있어야 한다(아래 volumes의 ./ 경로).
#
# 띄우는 방법(배포 스크립트가 한다):
#   SERVER_IMAGE=... WEB_IMAGE=... SW_DISABLE=no \
#     docker compose --project-name akkimpyo --file /opt/akkimpyo/deploy/compose.yaml --env-file /etc/akkimpyo/app.env up -d
# - SERVER_IMAGE, WEB_IMAGE, SW_DISABLE: deploy/production.env에서 배포 스크립트가 검사한 값을 셸 환경으로 넘긴다.
#   셸 환경이 --env-file보다 앞선다. 이 셋은 app.env에 두지 않는다.
# - 그 밖의 변수: /etc/akkimpyo/app.env(root 전용, 0600). 이름과 뜻은 deploy/env.example, 허용 목록은 deploy/env.allowlist다.
# - env_file을 쓰지 않는다. 컨테이너마다 아래 environment에 적은 변수만 들어간다.
# - ${이름:?}인 변수가 없거나 비어 있으면 compose가 멈춘다. Docker는 없는 변수를 빈 문자열로 넘기기 때문이다.
#
# 다른 서비스(owner의 prometheus, grafana)와 Docker를 나눠 쓴다. 이 프로젝트의 이름, 네트워크, 볼륨만 쓴다.
# 메모리, shared_buffers, 스왑, shm 값은 compose.perf.yaml과 같게 둔다. 바꿀 때는 perf에게 알린다(#52 범위 보강 3).
#
# 시험: deploy/tests/proxy-run

name: akkimpyo

x-logging: &logging
  # 컨테이너 로그를 이 파일 안에서 순환한다. Docker 데몬 설정은 건드리지 않는다.
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  proxy:
    image: ${WEB_IMAGE:?WEB_IMAGE가 없다}
    restart: unless-stopped
    logging: *logging
    networks: [akkimpyo]
    # 호스트에 여는 포트는 이 둘뿐이다. 값은 "포트" 또는 "주소:포트"다.
    # 인증서를 받으려면 밖에서 80(HTTP-01)이나 443(TLS-ALPN-01)으로 닿아야 한다(docs/ops/domain.md 1절 5번).
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS가 없다}
      SW_DISABLE: ${SW_DISABLE:?SW_DISABLE가 없다}
      ACCESS_LOG_KEEP_DAYS: ${ACCESS_LOG_KEEP_DAYS:-14}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 인증서와 ACME 계정, 접근 로그(/data/access-log). 지우지 않는다(docs/ops/domain.md 1절 6번).
      - caddy-data:/data
      - caddy-config:/config
      # 바로 앞 판의 /srv/assets. 배포 스크립트가 교체 직전에 돌고 있던 웹 컨테이너의 /srv/assets 안의 파일을 이 볼륨의 맨 위에 복사한다(#52 범위 보강 21).
      - assets-prev:/srv-prev/assets:ro
    # 웹 이미지는 10001로 돈다. 1024 미만 포트는 Docker가 컨테이너 안에서 root 없이 열게 한다(ip_unprivileged_port_start=0).
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp
    mem_limit: 256m
    memswap_limit: 256m

  server:
    image: ${SERVER_IMAGE:?SERVER_IMAGE가 없다}
    restart: unless-stopped
    logging: *logging
    networks: [akkimpyo]
    environment:
      # local이 아닌 값으로 고정한다. application-local.yml은 기본 비밀번호를 담고 있다(#52 범위 보강 6).
      SPRING_PROFILES_ACTIVE: prod
      # 힙은 메모리 한도의 60%(이미지의 기본값과 같다). 힙이 모자라면 느려지는 대신 끝나서 재시작으로 드러나게 한다.
      JDK_JAVA_OPTIONS: -XX:MaxRAMPercentage=60.0 -XX:+ExitOnOutOfMemoryError
      DB_URL: ${DB_URL:?DB_URL이 없다}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME이 없다}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD가 없다}
      ACCESS_TOKEN_SIGNING_KEY: ${ACCESS_TOKEN_SIGNING_KEY:?ACCESS_TOKEN_SIGNING_KEY가 없다}
      # 프록시의 사이트 주소와 같은 변수에서 나온다. 어긋나면 로그인이 403이 된다(#52 범위 보강 17).
      WEB_ORIGIN: ${SITE_ADDRESS:?SITE_ADDRESS가 없다}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      # Tomcat의 작업 폴더와 Java의 임시 파일.
      - /tmp
    mem_limit: 1g
    memswap_limit: 1g
    # 토큰 없이 GET /actuator/health 하나만 본다(HEAD와 하위 경로는 쓰지 않는다). 이미지에 있는 curl을 쓴다.
    # 응답에 DB 상태가 들어 있어 DB가 내려가면 unhealthy가 된다. 상태 표시일 뿐이고 Docker는 unhealthy로 재시작하지 않는다.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 90s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17.12-trixie@sha256:97fb53376be3e4fb1a8a61421daa69dcc3bf2fa39bda3259f5245f9a455af1a9
    restart: unless-stopped
    logging: *logging
    networks: [akkimpyo]
    # 처음부터 postgres 사용자로 띄운다. root로 띄우면 진입 스크립트가 권한을 바꾸려다 cap_drop에 막힌다.
    user: postgres
    command:
      - postgres
      # compose.perf.yaml과 같다(#52 범위 보강 3).
      - -c
      - shared_buffers=256MB
      # 제약 위반의 DETAIL(행의 값)을 로그에 남기지 않는다(security, PR #153). log_statement, log_min_duration_statement,
      # log_parameter_max_length_on_error는 기본값(값을 찍지 않음)을 그대로 둔다.
      - -c
      - log_error_verbosity=terse
      # Hibernate가 제약 이름을 영어 오류 메시지에서 뽑는다(docs/db/schema-standards.md). 이미지의 기본값과 같은 값을 고정한다.
      - -c
      - lc_messages=en_US.utf8
    environment:
      # 관리 역할(슈퍼유저). 백업(deploy/bin/backup)과 owner가 컨테이너 안에서 로컬 소켓으로만 쓴다.
      POSTGRES_USER: postgres
      # 이미지가 처음 만들 때 요구해서 넣는다. db-init.sh가 관리 역할의 비밀번호를 지워 TCP로는 로그인할 수 없게 한다.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD가 없다}
      # 운영 DB. DB_URL의 DB 이름과 같아야 한다.
      POSTGRES_DB: accountbook
      # 데이터 체크섬은 처음 만들 때만 켤 수 있다(dba, docs/db/backup-restore.md).
      POSTGRES_INITDB_ARGS: --data-checksums
      # db-init.sh가 서버가 쓰는 역할을 이 이름과 비밀번호로 만든다. 처음 만들 때만 쓴다.
      APP_DB_USER: ${DB_USERNAME:?DB_USERNAME이 없다}
      APP_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD가 없다}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp
      - /var/run/postgresql
    # 병렬 쿼리가 쓰는 /dev/shm. Docker 기본값은 64MB다(#52 범위 보강 3).
    shm_size: 256m
    mem_limit: 1g
    memswap_limit: 1g
    # 체크포인트를 끝내고 내려가게 기다린다. 기본 10초가 지나면 SIGKILL이다.
    stop_grace_period: 60s
    # 운영 DB가 아니라 postgres DB에 붙는다. 복원 SQL은 같은 DB에 다른 연결이 있으면 멈춘다(#52 범위 보강 10).
    healthcheck:
      test: ["CMD", "pg_isready", "--quiet", "--dbname=postgres", "--username=postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  # 이 프로젝트 전용이다. 다른 프로젝트의 네트워크에 붙지 않는다.
  akkimpyo: {}

volumes:
  db-data:
  caddy-data:
  caddy-config:
  assets-prev:
