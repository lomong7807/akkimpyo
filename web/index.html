<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 브라우저 위쪽 색은 tokens.css의 --color-bg와 같아야 한다 -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F7F8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F1214" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <!-- font-display: optional이라 첫 그리기 전에 글꼴이 준비돼야 쓰인다(src/styles/fonts.css) -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/src/assets/fonts/pretendard/PretendardVariable.woff2"
      crossorigin
    />
    <title>아낌표</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
