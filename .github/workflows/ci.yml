name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'claudedocs/**'
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'claudedocs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: server (Gradle build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      # 캐시와 Gradle wrapper jar 체크섬 검증(validate-wrappers, 기본 true)은 이 액션의 기본 동작을 쓴다.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # 테스트는 Testcontainers로 PostgreSQL을 띄우므로 러너의 Docker를 그대로 쓴다.
      - name: Build and test
        run: ./gradlew build

  web:
    name: web (lint, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.3.0'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # 새 취약점 공개로 빨개진 것과 코드 때문에 빨개진 것을 구분하려고 web과 따로 둔다.
  web-audit:
    name: web (npm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # npm ci를 하지 않으므로 npm 캐시를 켜지 않는다. 켜면 이 job이 web보다 먼저 끝나
      # 거의 빈 ~/.npm을 같은 캐시 키로 저장하고, web job의 캐시 저장이 막힌다.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.3.0'

      - name: Audit (high 이상이면 실패)
        run: npm audit --audit-level=high
