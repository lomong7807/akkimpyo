name: Security

# ci.yml과 달리 paths-ignore를 두지 않는다. 문서에도 비밀값이 들어갈 수 있다.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# shell을 적어야 pipefail이 켜진다.
defaults:
  run:
    shell: bash

# 아래 도구의 버전과 sha256은 Dependabot이 갱신하지 않는다. 올릴 때는 공식 릴리스의 체크섬 파일을 보고
# 두 값을 함께 바꾼다.
jobs:
  gitleaks:
    name: gitleaks (git history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # sha256 출처: gitleaks_8.30.1_checksums.txt
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks

      # log-opts는 gitleaks 8.30.1의 기본값(--full-history --all --diff-filter=tuxdb)에 -m을 더한 것이다.
      # -m이 없으면 merge 커밋에서만 들어온 내용을 보지 않는다.
      # gitleaks는 git 명령이 실패해도 "no leaks found"와 종료 코드 0을 낸다. 그래서 로그로 실제 검사 여부를 확인한다.
      - name: Scan (모든 브랜치의 전체 기록)
        run: |
          log="$RUNNER_TEMP/gitleaks.log"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --no-banner --no-color --redact --verbose \
            --log-opts="--full-history --all --diff-filter=tuxdb -m" . 2>&1 | tee "$log"
          if grep -qE ' (ERR|FTL) ' "$log" || ! grep -qE ' INF [1-9][0-9]* commits scanned' "$log"; then
            echo "::error::gitleaks가 git 기록을 끝까지 읽지 못했다"
            exit 1
          fi

  osv:
    name: osv (web, server dependencies)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      # basic 캐시의 키는 Gradle 파일 해시라서 ci.yml의 server job과 같다. main push에서 이 job이 먼저 저장하면
      # 테스트 의존성이 빠진 캐시가 그 키를 차지하므로 읽기만 한다.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true

      # sha256 출처: osv-scanner_SHA256SUMS (v2.7.1)
      - name: Install OSV-Scanner
        env:
          OSV_SCANNER_VERSION: '2.7.1'
          OSV_SCANNER_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
        run: |
          binary="$RUNNER_TEMP/osv-scanner"
          curl -fsSL --retry 3 -o "$binary" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  ${binary}" | sha256sum --check --strict
          chmod +x "$binary"

      # 레포에는 Gradle lockfile이 없다. build.gradle을 바꾸지 않고 init script로 이 실행에서만
      # runtimeClasspath의 dependency locking을 켜서 작업 폴더 밖에 lockfile을 만든다(테스트 의존성 제외).
      # 내장 dependencies 태스크는 해석하지 못한 의존성이 있어도 성공하므로 실패를 그대로 던지는 태스크를 쓴다.
      # 목록이 비면 OSV-Scanner가 "No issues found"로 통과하므로 마지막 줄에서 한 건 이상인지 확인한다.
      - name: List server runtime dependencies
        working-directory: server
        run: |
          mkdir "$RUNNER_TEMP/osv-server"
          cat > "$RUNNER_TEMP/osv.init.gradle" <<'EOF'
          allprojects {
              dependencyLocking {
                  lockFile = file("${System.getenv('RUNNER_TEMP')}/osv-server/gradle.lockfile")
              }
              configurations.matching { it.name == 'runtimeClasspath' }.configureEach {
                  resolutionStrategy.activateDependencyLocking()
              }
              tasks.register('lockRuntimeClasspath') {
                  doLast { configurations.runtimeClasspath.resolvedConfiguration.rethrowFailure() }
              }
          }
          EOF
          ./gradlew --init-script "$RUNNER_TEMP/osv.init.gradle" lockRuntimeClasspath --write-locks
          grep -cE '^[^:]+:[^:]+:[^=]+=runtimeClasspath$' "$RUNNER_TEMP/osv-server/gradle.lockfile"

      # 알려진 취약점이 한 건이라도 있으면 실패한다. 임계값과 무시 목록은 두지 않는다.
      - name: Scan
        run: |
          "$RUNNER_TEMP/osv-scanner" scan source \
            --lockfile web/package-lock.json \
            --lockfile "$RUNNER_TEMP/osv-server/gradle.lockfile"
