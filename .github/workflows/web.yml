name: web

# web/나 이 파일이 바뀔 때만 돈다. server만 바꾼 PR에서는 돌지 않는다.
# paths와 paths-ignore는 한 이벤트에 같이 쓸 수 없어 문서 제외는 '!' 패턴으로 적는다.
# docs/와 claudedocs/는 위 경로 밖이라 따로 뺄 필요가 없다.
on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
      # 첫 화면 JS 크기 검사(#252)의 스크립트, 테스트, 기준값. 기준값 파일만 바꿔도 검사가 돈다.
      - 'scripts/check-initial-js-size.mjs'
      - 'scripts/tests/check-initial-js-size.test.mjs'
      - 'docs/perf/budget.json'
      - '!**/*.md'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
      # 첫 화면 JS 크기 검사(#252)의 스크립트, 테스트, 기준값. 기준값 파일만 바꿔도 검사가 돈다.
      - 'scripts/check-initial-js-size.mjs'
      - 'scripts/tests/check-initial-js-size.test.mjs'
      - 'docs/perf/budget.json'
      - '!**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: web (lint, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.3.0'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # 첫 화면 JS(index.html이 처음 싣는 JS와 그 정적 import, gzip level 9)를
      # docs/perf/budget.json의 기준값과 견주고, 넘으면 실패한다(#252). 크기는 로그와 job summary에 남는다.
      # 검사 스크립트의 테스트를 web 테스트와 섞지 않고 여기서 먼저 돌린다.
      # --experimental-vm-modules: manifest가 없어 빌드 결과 JS를 V8로 파싱해 정적 import를 찾는 데 쓴다.
      - name: Initial JS size
        run: |
          node --test ../scripts/tests/check-initial-js-size.test.mjs
          node --experimental-vm-modules --disable-warning=ExperimentalWarning ../scripts/check-initial-js-size.mjs

  # 테스트가 2코어 러너 한 대에서 5분을 넘어, Vitest --shard로 나눠 러너 여러 대에서 동시에 돌린다.
  # Vitest는 파일 경로의 해시 순으로 파일 수만 고르게 나누므로 shard 사이 시간은 고르지 않다.
  # shard 수를 바꿀 때는 shard 목록과 total을 함께 바꾼다.
  web-test:
    name: web (test ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.3.0'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Test
        env:
          SHARD: ${{ matrix.shard }}/${{ matrix.total }}
        run: npm test -- --shard="$SHARD"

  # 새 취약점 공개로 빨개진 것과 코드 때문에 빨개진 것을 구분하려고 web과 따로 둔다.
  web-audit:
    name: web (npm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # npm ci를 하지 않으므로 npm 캐시를 켜지 않는다. 켜면 이 job이 web보다 먼저 끝나
      # 거의 빈 ~/.npm을 같은 캐시 키로 저장하고, web job의 캐시 저장이 막힌다.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.3.0'

      - name: Audit (high 이상이면 실패)
        run: npm audit --audit-level=high
