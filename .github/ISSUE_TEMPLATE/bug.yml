name: 버그 보고
description: 기대와 다르게 움직이는 것을 알린다.
title: "[영역] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        - 제목은 `[영역] 무엇이 어떻게 잘못되는지 한 줄`로 쓴다.
        - 다시 생긴 버그는 제목 맨 앞에 `REGRESSION:`을 붙인다.
        - 영역은 server, web, db, infra, design, security, planning, architecture, perf, test 중 하나다.
        - 실제 카드 내역, 개인신용정보, 토큰은 넣지 않는다.
  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 한두 문장으로 쓴다.
    validations:
      required: true
  - type: input
    id: frequency
    attributes:
      label: 재현 빈도
      description: 몇 번 해서 몇 번 생겼는지 적는다.
      placeholder: "예: 5회 중 5회"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 단계
      description: 번호를 붙여 쓴다. 입력값은 그대로 적는다.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
      description: 근거를 같이 적는다. 기능정의서의 F-ID/P-ID 또는 화면설계서 위치.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
      description: 오류 문구, 응답 코드, 로그를 그대로 적는다. 저장된 값이 틀린지 화면 표시만 틀린지 적는다.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 환경
      description: "커밋 또는 PR 번호, 브라우저·기기·OS, 화면 크기, 계정 역할(소유자/구성원/보기 전용/구성원 아님)을 적는다."
    validations:
      required: true
  - type: textarea
    id: data-conditions
    attributes:
      label: 데이터 조건
      description: "날짜와 시각(월말·1일·연말·자정 앞뒤), 금액 경계값, 거래 유형, 계좌 종류를 적는다."
    validations:
      required: false
  - type: input
    id: last-good
    attributes:
      label: 마지막으로 정상이던 커밋 또는 PR
      description: 알 때만 적는다. REGRESSION이면 꼭 적는다.
    validations:
      required: false
  - type: input
    id: occurred-at
    attributes:
      label: 일어난 시각과 요청 id
      description: 시각은 Asia/Seoul 기준으로 적는다.
    validations:
      required: false
  - type: textarea
    id: workaround-impact
    attributes:
      label: 우회 방법과 영향 범위
      description: "우회가 있는지 없는지 적는다. 영향은 모든 사용자인지, 특정 역할·데이터인지 적는다."
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: 증거
      description: 스크린샷, 요청·응답을 붙인다.
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      description: 올린 쪽 판단이다. 데이터·금액이 틀리면 치명이다.
      options:
        - 치명(S1)
        - 높음(S2)
        - 보통(S3)
        - 낮음(S4)
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 우선순위 제안
      description: 의견일 뿐이다. 결정은 owner가 한다.
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: false
  - type: dropdown
    id: confidence
    attributes:
      label: 확인 구분
      options:
        - 확인
        - 추정
        - 미확인
    validations:
      required: true
  - type: dropdown
    id: found-by
    attributes:
      label: 찾은 경로
      options:
        - 탐색 세션
        - 수용 기준 검증
        - 회귀 점검
        - 그 밖
    validations:
      required: false
